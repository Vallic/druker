# The three sections, as tabs across the top of every Druker page.
druker.dashboard:
  title: Dashboard
  route_name: druker.dashboard
  base_route: druker.dashboard
  weight: -10

druker.tasks.jobs:
  title: 'Cron Jobs'
  route_name: entity.druker_job.collection
  base_route: druker.dashboard
  weight: 0

druker.tasks.servers:
